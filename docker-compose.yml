services:
  mysql:
    image: mysql:8.0
    container_name: shreeaxar-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-shreeaxar_erp}
      MYSQL_USER: ${DB_USERNAME:-shreeaxar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - shreeaxar

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: shreeaxar-app:dev
    container_name: shreeaxar-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment: &app-env
      APP_NAME: ${APP_NAME:-Shree Axar ERP}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8001}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-shreeaxar_erp}
      DB_USERNAME: ${DB_USERNAME:-shreeaxar}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5174}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:5174,127.0.0.1:5174}
      RUN_SEED: ${RUN_SEED:-true}
    command: ["php-fpm"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shreeaxar

  nginx:
    image: nginx:1.27-alpine
    container_name: shreeaxar-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8001}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - shreeaxar

  node:
    image: node:20-alpine
    container_name: shreeaxar-node
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5174}:5174"
    environment:
      VITE_PORT: ${VITE_PORT:-5174}
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_APP_NAME: ${APP_NAME:-Shree Axar ERP}
      VITE_STORAGE_URL: ${VITE_STORAGE_URL:-http://localhost:8001/storage}
      VITE_SESSION_IDLE_MINUTES: ${VITE_SESSION_IDLE_MINUTES:-30}
      VITE_DEV_PROXY_TARGET: http://nginx:80
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port $${VITE_PORT:-5174}"
    depends_on:
      - nginx
    networks:
      - shreeaxar

  scheduler:
    image: shreeaxar-app:dev
    container_name: shreeaxar-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      <<: *app-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until php artisan --version >/dev/null 2>&1; do
          echo "Waiting for Laravel app..."
          sleep 3
        done
        php artisan schedule:work
    depends_on:
      - app
    networks:
      - shreeaxar

networks:
  shreeaxar:
    driver: bridge

volumes:
  mysql_data:
  vendor_data:
  node_modules_data:

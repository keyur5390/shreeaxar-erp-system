services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-shreeaxar_erp}
      MYSQL_USER: ${DB_USERNAME:-shreeaxar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - shreeaxar

  app:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: app
    restart: unless-stopped
    environment: &app-env
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-shreeaxar_erp}
      DB_USERNAME: ${DB_USERNAME:-shreeaxar}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080,127.0.0.1:8080}
      RUN_SEED: ${RUN_SEED:-true}
    volumes:
      - app_storage:/var/www/html/storage
    entrypoint: ["/bin/sh", "/var/www/html/docker/app/entrypoint.sh"]
    command: ["php-fpm"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shreeaxar

  web:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - app
    networks:
      - shreeaxar

networks:
  shreeaxar:
    driver: bridge

volumes:
  mysql_data:
  app_storage:
